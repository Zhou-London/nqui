linkWorkspacePackages: true

# pnpm 12 refuses to run dependency install scripts unless they are reviewed here.
allowBuilds:
  "@parcel/watcher": true

# Packages published within pnpm's default minimum release age that we still want now.
minimumReleaseAgeExclude:
  - "@tanstack/react-virtual@3.14.11"
  - "@tanstack/virtual-core@3.17.9"
